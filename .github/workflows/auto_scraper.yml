name: 🔄 24/7 Cloud Auto-Updater & Comic Chapter Sync

on:
  schedule:
    # Runs automatically every 30 minutes 24/7 in the cloud (even when PC is turned off)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  auto-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🚀 Run Cloud Auto-Updater & Static Site Generator
        run: |
          python cloud_auto_updater.py

      - name: 📤 Auto Commit & Push to Main (Triggering Cloudflare Deploy)
        run: |
          git config --global user.name "OniVerse Auto-Bot"
          git config --global user.email "bot@oniverse.sbs"
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping push."
          else
            git commit -m "chore(bot): 24/7 cloud auto-sync latest chapter updates from Shinigami & Komikcast"
            git push origin main
          fi
